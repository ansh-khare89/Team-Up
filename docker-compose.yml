services:
  database:
    image: postgres:16-alpine
    container_name: teamup-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamup}
      POSTGRES_USER: ${POSTGRES_USER:-teamup_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamup_user} -d ${POSTGRES_DB:-teamup}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teamup-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: teamup-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-teamup}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-teamup_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - teamup-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: teamup-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - teamup-network

volumes:
  postgres_data:

networks:
  teamup-network:
    driver: bridge
