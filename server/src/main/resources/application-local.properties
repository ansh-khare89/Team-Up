server.port=${PORT:5000}

# H2 Database Configuration for local development
spring.datasource.url=jdbc:h2:mem:teamup
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Local Development Security & CORS Defaults
JWT_SECRET=${JWT_SECRET:teamup-local-development-secret-jwt-key-2026-32chars}
FRONTEND_URL=${FRONTEND_URL:http://localhost:3000,http://localhost:3001}

